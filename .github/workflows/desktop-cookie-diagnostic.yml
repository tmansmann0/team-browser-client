name: diagnose fixed candidate cookie hang (manual, one reproduction)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  immutable-candidate-diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11310884356'
          run-id: '37224078859'
          repository: tmansmann0/team-browser-client
          github-token: ${{ github.token }}
          merge-multiple: true
          path: desktop/diagnostic-input
      - name: Validate diagnostic helper contracts
        run: node --test desktop/tests/cookie-diagnostic.test.cjs
      - name: Observe unchanged candidate once with blank profiles
        run: node desktop/scripts/diagnose-cookie-hang.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamBrowser-cookie-diagnostic-62d56b3-${{ github.sha }}-NOT-ACCEPTANCE
          path: desktop/out/cookie-diagnostic/
          if-no-files-found: error
          retention-days: 1
