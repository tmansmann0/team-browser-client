name: rendered local workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]' playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s e2e -p 'test_*.py' -v
        env:
          TBM_RUN_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-workspace-browser-evidence
          path: artifacts/browser
          if-no-files-found: warn
