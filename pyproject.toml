[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
[project]
name = "team-browser-client"
version = "0.2.0"
description = "Local-first team browser workspace client"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141,<0.142", "uvicorn>=0.41,<0.42", "h11>=0.16,<0.17", "cryptography>=50,<51", "PyJWT[crypto]>=2.10,<3"]
[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "ruff==0.16.10"]
native = ["playwright==1.62.0"]
camoufox = ["camoufox==0.5.6", "playwright==1.62.0", "browserforge==1.2.4", "apify-fingerprint-datapoints==0.15.0"]
[project.scripts]
tbm-client = "team_browser.client_cli:main"
tbm-desktop-sidecar = "team_browser.desktop_sidecar:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
team_browser = ["static/*", "static/brand/*", "static/brand/TeamBrowser.iconset/*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
